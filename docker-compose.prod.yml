# Use explicitly with the base file; the development override is not loaded.
services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:${API_PORT:-3000}"
    environment: &production-environment
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the public HTTPS origin}
  migrate:
    environment: *production-environment
  seed:
    environment: *production-environment
